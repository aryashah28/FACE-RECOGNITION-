<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Portal - VisionID</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 2.5rem; color: #0f172a; margin-bottom: 10px; }
        p.subtitle { color: #64748b; font-size: 1.1rem; }

        /* DEPARTMENTS GRID */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .dept-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .dept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
        .dept-card i { font-size: 2rem; margin-bottom: 15px; display: block; }
        .dept-card h3 { font-size: 1.25rem; color: #1e293b; }

        /* DETAILS SECTION */
        #details-section {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .info-box {
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
        }
        .info-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .info-value { font-size: 1.1rem; color: #0f172a; font-weight: 600; }

        .back-btn {
            background: #e2e8f0;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-btn:hover { background: #cbd5e1; }

        .access-denied {
            text-align: center;
            padding: 50px;
            color: #ef4444;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="/home" style="display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3b82f6; font-weight: 600;">← Back to Home</a>
        <h1>Department Portal</h1>
        <p class="subtitle">Access your department-specific records and personal data</p>
    </header>

    <div class="dept-grid" id="dept-grid">
        <div class="dept-card" onclick="viewDept('HR')">
            <span>👥</span>
            <h3>HR</h3>
        </div>
        <div class="dept-card" onclick="viewDept('FINANCE')">
            <span>💰</span>
            <h3>FINANCE</h3>
        </div>
        <div class="dept-card" onclick="viewDept('OPERATIONS')">
            <span>⚙️</span>
            <h3>OPERATIONS</h3>
        </div>
        <div class="dept-card" onclick="viewDept('TECHNICAL')">
            <span>💻</span>
            <h3>TECHNICAL</h3>
        </div>
    </div>

    <div id="details-section">
        <div class="details-header">
            <h2 id="dept-title">Department Details</h2>
            <button class="back-btn" onclick="closeDetails()">Close</button>
        </div>
        <div id="details-content">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<script>
function viewDept(dept) {
    fetch('/get_dept_info', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
        },
        body: JSON.stringify({ department: dept })
    })
    .then(res => res.json())
    .then(data => {
        const section = document.getElementById('details-section');
        const grid = document.getElementById('dept-grid');
        const content = document.getElementById('details-content');
        const title = document.getElementById('dept-title');

        grid.style.display = 'none';
        section.style.display = 'block';
        title.innerText = dept + (data.type === 'all_records' ? " - Company Payroll" : " - My Records");

        if (data.status === 'success') {
            if (data.type === 'all_records') {
                // RENDER TABLE FOR ADMIN/HR IN FINANCE
                let tableHtml = `
                    <div style="overflow-x: auto; margin-top: 20px;">
                        <table style="width: 100%; border-collapse: collapse; min-width: 600px;">
                            <thead>
                                <tr style="background: #f8fafc; text-align: left;">
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Employee</th>
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">ID</th>
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Designation</th>
                                    <th style="padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 0.75rem; color: #64748b; text-transform: uppercase;">Salary (₹)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                data.data.forEach(emp => {
                    tableHtml += `
                        <tr style="border-bottom: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='white'">
                            <td style="padding: 12px; font-weight: 600; color: #0f172a;">${emp.name}</td>
                            <td style="padding: 12px; color: #64748b; font-family: monospace;">${emp.employee_id}</td>
                            <td style="padding: 12px; color: #1e293b;">${emp.designation}</td>
                            <td style="padding: 12px; font-weight: 700; color: #059669;">₹${emp.salary.toLocaleString()}</td>
                        </tr>
                    `;
                });

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                content.innerHTML = tableHtml;

            } else {
                const user = data.data;
                let cardsHtml = `
                    <div class="details-grid">
                        <div class="info-box">
                            <div class="info-label">Full Name</div>
                            <div class="info-value">${user.name}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Employee ID</div>
                            <div class="info-value">${user.employee_id}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Assigned Department</div>
                            <div class="info-value">${user.department}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Designation</div>
                            <div class="info-value">${user.designation}</div>
                        </div>
                `;

                if (dept === 'FINANCE') {
                    cardsHtml += `
                        <div class="info-box" style="background: #ecfdf5; border: 1px solid #10b981; grid-column: span 2;">
                            <div class="info-label" style="color: #047857;">Monthly Salary</div>
                            <div class="info-value" style="color: #059669; font-size: 1.5rem;">₹${user.salary.toLocaleString()}</div>
                        </div>
                    `;
                } else {
                    cardsHtml += `
                        <div class="info-box">
                            <div class="info-label">Email</div>
                            <div class="info-value">${user.email}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Contact</div>
                            <div class="info-value">${user.phone}</div>
                        </div>
                    `;
                }

                cardsHtml += `
                    </div>
                    <div style="margin-top: 30px; padding: 20px; background: #f0f9ff; border-radius: 12px; border-left: 4px solid #3b82f6;">
                        <p style="font-size: 0.9rem; color: #0369a1;"><strong>Note:</strong> You have full access to ${dept} records as per your clearance.</p>
                    </div>
                `;
                content.innerHTML = cardsHtml;
            }
        } else {
            content.innerHTML = `
                <div class="access-denied">
                    <h3>🚫 Access Denied</h3>
                    <p>${data.message}</p>
                </div>
            `;
        }
    });
}

function closeDetails() {
    document.getElementById('details-section').style.display = 'none';
    document.getElementById('dept-grid').style.display = 'grid';
}
</script>

    <script>
        // Inactivity Timer: Redirect to logout after 1 minute of no activity
        (function() {
            let timeout;
            const inactivityLimit = 60000; // 60 seconds

            function resetTimer() {
                clearTimeout(timeout);
                timeout = setTimeout(logout, inactivityLimit);
            }

            function logout() {
                console.log("Inactivity detected. Redirecting to logout...");
                window.location.href = '/logout';
            }

            // Events that reset the timer
            const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
            
            events.forEach(function(name) {
                document.addEventListener(name, resetTimer, true);
            });

            // Initial start
            resetTimer();
        })();
    </script>

</body>
</html>
