# fly.toml app configuration file for face-recognition

app = "" # Leave empty, Fly.io will auto-fill or use the name from the dashboard
primary_region = "bom"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "db_vol"
  destination = "/var/data"

[env]
  DATABASE_PATH = "/var/data/database.db"
  PORT = "5000"
  DEBUG = "False"
