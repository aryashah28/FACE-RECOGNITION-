<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionID – Register Employee</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* SUBTLE LIGHT PREMIUM BACKGROUND */
            background-color: #f8fafc;
            /* Slate 50 */
            background-image:
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.12), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.12), transparent 40%);
            color: #0f172a;
            position: relative;
            padding: 2rem 0;
            /* Add top/bottom padding for scrolling */
        }

        /* SOFT GRID OVERLAY */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* GLASSMORPHIC CARD - LIGHT MODE */
        .register-card {
            background: rgba(255, 255, 255, 0.85);
            /* Frosty white */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 2rem 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            z-index: 2;
            text-align: center;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }

            from {
                transform: translateY(40px);
                opacity: 0;
            }
        }

        .icon-wrapper {
            width: 54px;
            height: 54px;
            background: rgba(59, 130, 246, 0.1);
            /* Subtle blue */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1rem auto;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .icon-wrapper svg {
            color: #2563eb;
            width: 28px;
            height: 28px;
        }

        .title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            /* Slate 600 */
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            /* Dark text */
            font-size: 0.85rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px -8px rgba(37, 99, 235, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
        }

        /* BACK LINK */
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0f172a;
        }
    </style>
</head>

<body>

    <div class="grid-overlay"></div>

    <div class="register-card">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="19" y1="8" x2="19" y2="14"></line>
                <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
        </div>

        <h2 class="title">Register Employee</h2>
        <p class="subtitle">Enter the employee details below to begin the facial capture enrollment.</p>

        <!-- Camera Box -->
        <div class="camera-box" style="width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid #cbd5e1; background: #0f172a; margin-bottom: 1rem; position: relative;">
            <video id="video" autoplay playsinline style="width: 100%; display: block; transform: scaleX(-1);"></video>
            <div class="face-circle" style="position: absolute; top: 50%; left: 50%; width: 140px; height: 140px; border: 2px solid #2563eb; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); pointer-events: none;"></div>
            <div id="status" style="position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(15, 23, 42, 0.85); color: #94a3b8; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-align: center; text-transform: uppercase;">Ready to capture</div>
        </div>

        <form action="/register" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="name">Employee Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Login Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required>
            </div>



            <div class="form-group">
                <label class="form-label" for="birthdate">Birthdate</label>
                <input type="date" id="birthdate" name="birthdate" class="form-input" max="2026-12-31" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 234 567 890" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email-ID</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="email@example.com" required
                    autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="occupation">Occupation</label>
                <input type="text" id="occupation" name="occupation" class="form-input" placeholder="e.g. Technology"
                    required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="designation">Designation</label>
                <input type="text" id="designation" name="designation" class="form-input" placeholder="e.g. Senior Manager"
                    required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="department">Department</label>
                <select id="department" name="department" class="form-input" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="HR">HR</option>
                    <option value="FINANCE">FINANCE</option>
                    <option value="OPERATIONS">OPERATIONS</option>
                    <option value="TECHNICAL">TECHNICAL</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="gender">Gender</label>
                <select id="gender" name="gender" class="form-input" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="base_location">Base Location</label>
                <input type="text" id="base_location" name="base_location" class="form-input" value="AHMEDABAD" required>
            </div>

            <button type="submit" class="submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                Register & Capture Face
            </button>
        </form>

        <a href="/home" class="back-link">← Return to Dashboard</a>
    </div>

    <script>
        let video = document.getElementById("video");
        let status = document.getElementById("status");
        let streamObj = null;

        // 🎥 Start Camera
        navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: "user"
            }
        })
        .then(stream => {
            video.srcObject = stream;
            streamObj = stream;
        })
        .catch(err => {
            console.error("Camera access error:", err);
            status.innerText = "❌ Camera Error";
            status.style.color = "#ef4444";
        });

        // 📸 Handle Form Submission
        const form = document.querySelector("form");
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (!video.videoWidth) {
                alert("Please wait for the camera to load.");
                return;
            }
            
            status.innerText = "Capturing Face...";
            status.style.color = "#2563eb";
            
            // Capture image
            let canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0);
            let base64Image = canvas.toDataURL("image/jpeg", 0.9);
            
            // Build payload
            let formData = new FormData(form);
            let payload = {};
            formData.forEach((value, key) => {
                payload[key] = value;
            });
            payload["image"] = base64Image;
            
            // Submit
            fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    status.innerText = "✅ Registered!";
                    status.style.color = "#10b981";
                    alert(data.message);
                    
                    if (streamObj) {
                        streamObj.getTracks().forEach(track => track.stop());
                    }
                    window.location.href = "/home";
                } else {
                    status.innerText = "❌ Fail";
                    status.style.color = "#ef4444";
                    alert(data.message);
                }
            })
            .catch(err => {
                console.error("Register error:", err);
                status.innerText = "❌ Error occurred";
                status.style.color = "#ef4444";
                alert("An error occurred. Please try again.");
            });
        });
    </script>

</body>

</html>
