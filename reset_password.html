<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionID – Reset Password</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* SUBTLE PREMIUM BACKGROUND */
            background-color: #0f172a;
            /* Slate 900 */
            background-image:
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.06), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.06), transparent 40%);
            color: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        /* SOFT GRID OVERLAY */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        /* GLASSMORPHIC CARD */
        .register-card {
            background: rgba(30, 41, 59, 0.65);
            /* Slate 800 with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 2;
            text-align: center;
            transform: translateY(20px);
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }

            from {
                transform: translateY(40px);
                opacity: 0;
            }
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .icon-wrapper svg {
            color: #60a5fa;
        }

        .title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* FORM ELEMENTS */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:focus {
            background: rgba(15, 23, 42, 0.6);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(37, 99, 235, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(37, 99, 235, 0.6);
            background: linear-gradient(135deg, #1d4ed8, #0284c7);
        }

        /* BACK LINK */
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="grid-overlay"></div>

    <div class="register-card">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h2 class="title">Reset Password</h2>
        <p class="subtitle">Enter your details to change your secure access key. Admin password works for any user.</p>

        <form id="resetPasswordForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="employee_id">Employee ID</label>
                <input type="text" id="employee_id" name="employee_id" class="form-input" placeholder="e.g. EMP-1042"
                    required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="current_password">Current Password (or Admin Password)</label>
                <input type="password" id="current_password" name="current_password" class="form-input"
                    placeholder="Current or Admin access phrase" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-input"
                    placeholder="Strong new password" required autocomplete="off">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Confirm Reset
            </button>
            <div id="messageBox" style="margin-top: 15px; font-size: 0.9rem; display: none;"></div>
        </form>

        <a href="/" class="back-link">← Return to Login</a>
    </div>

    <script>
        document.getElementById("resetPasswordForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let btn = document.getElementById("submitBtn");
            let msg = document.getElementById("messageBox");

            btn.innerText = "Processing...";
            msg.style.display = "none";

            let formData = new FormData(this);
            let jsonData = {};
            formData.forEach((value, key) => { jsonData[key] = value });

            fetch("/reset_password", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
                },
                body: JSON.stringify(jsonData)
            })
                .then(res => res.json())
                .then(data => {
                    btn.innerText = "Confirm Reset";
                    msg.style.display = "block";

                    if (data.status === "success") {
                        msg.style.color = "#4ade80"; // green
                        msg.innerText = "✅ " + data.message + " Redirecting...";
                        setTimeout(() => {
                            window.location.href = data.redirect || "/";
                        }, 1500);
                    } else {
                        msg.style.color = "#f87171"; // red
                        msg.innerText = "❌ " + data.message;
                    }
                })
                .catch(err => {
                    btn.innerText = "Confirm Reset";
                    msg.style.display = "block";
                    msg.style.color = "#f87171";
                    msg.innerText = "❌ Error: " + err;
                });
        });
    </script>

</body>

</html>
